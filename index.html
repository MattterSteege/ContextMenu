<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Context Menu Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
    }
    #demo-area {
      width: 300px;
      height: 200px;
      background-color: white;
      border: 2px dashed #3b82f6;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: context-menu;
    }
  </style>
  <script src="ContextMenu.js"></script>
</head>
<body>
<div id="demo-area">
  Right-click here to open context menu
</div>

<script>
  // Create the main context menu
  const mainMenu = new ContextMenu({
    width: 250,
    style: {
      accent: '#3b82f6',
      backgroundColor: '#ffffff',
      textColor: '#333333'
    },
    closeOnClick: true,
    closeOnOutsideClick: true,
  });

  // Build the context menu with multiple submenus
  mainMenu
          .button("Open", () => alert("Open clicked"))
          .button("Save", () => alert("Save clicked"))
          .separator()
          .submenu("Edit", (submenu) => {
            submenu
                    .button("Cut", () => alert("Cut"))
                    .button("Copy", () => alert("Copy"))
                    .button("Paste", () => alert("Paste"))
                    .separator()
                    .submenu("Advanced", (advanced) => {
                      advanced
                              .button("Find", () => alert("Find"))
                              .button("Replace", () => alert("Replace"))
                    });
          })
          .submenu("View", (submenu) => {
            submenu
                    .checkbox("Fullscreen", {
                      checked: false,
                      onChange: (checked) => alert(`Fullscreen: ${checked}`)
                    })
                    .dropdown("Zoom", [
                      { value: "50", label: "50%" },
                      { value: "100", label: "100%" },
                      { value: "200", label: "200%" }
                    ], {
                      value: "100",
                      onChange: (value) => alert(`Zoom: ${value}`)
                    })
                    .input("Search", {
                      placeholder: "Search...",
                      onChange: (value) => alert(`Search: ${value}`)
                    })
                    .separator()
                    .radioGroup("Theme", [
                      { value: "light", label: "Light" },
                      { value: "dark", label: "Dark" }
                    ], {
                      value: "light",
                      onChange: (value) => alert(`Theme: ${value}`)
                    })
                    //instantiate like a dropdown
                    .searchSelect("Search", [
                      { value: "apple", label: "Apple" },
                      { value: "banana", label: "Banana" },
                      { value: "cherry", label: "Cherry" },
                        { value: "date", label: "Date" },
                        { value: "elderberry", label: "Elderberry" },
                        { value: "fig", label: "Fig" },
                        { value: "grape", label: "Grape" },
                        { value: "honeydew", label: "Honeydew" },
                        { value: "kiwi", label: "Kiwi" },
                        { value: "lemon", label: "Lemon" },
                        { value: "mango", label: "Mango" },
                        { value: "nectarine", label: "Nectarine" },
                        { value: "orange", label: "Orange" },
                        { value: "papaya", label: "Papaya" },
                        { value: "quince", label: "Quince" },
                        { value: "raspberry", label: "Raspberry" },
                        { value: "strawberry", label: "Strawberry" },
                        { value: "tangerine", label: "Tangerine" }
                    ], {
                      onChange: (value) => alert(`Selected: ${value}`)
                    });
          })
          .separator()
          .button("Help", () => alert("Help clicked"));

  // Add context menu event listener
  const demoArea = document.getElementById('demo-area');
  demoArea.addEventListener('contextmenu', (e) => {
    e.preventDefault(); // Prevent default context menu
    mainMenu.showAt(e.clientX, e.clientY);
  });
</script>
</body>
</html>
